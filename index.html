<!DOCTYPE html>
<html lang="uz">
<head>
  <meta charset="UTF-8">
  <meta name="viewport" content="width=device-width, initial-scale=1.0">
  <title>Yuzni tanish tizimi</title>

  <style>
    * {
      box-sizing: border-box;
    }

    body {
      margin: 0;
      font-family: Arial, sans-serif;
      background: #eef3f9;
      color: #14213d;
    }

    header {
      background: #102b50;
      color: white;
      padding: 24px 16px;
      text-align: center;
    }

    main {
      max-width: 720px;
      margin: 30px auto;
      padding: 24px;
      background: white;
      border-radius: 18px;
      box-shadow: 0 8px 30px #102b5015;
      text-align: center;
    }

    video {
      width: 100%;
      max-height: 380px;
      background: #111827;
      border-radius: 12px;
      margin-top: 16px;
    }

    button {
      border: 0;
      border-radius: 10px;
      padding: 13px 20px;
      margin: 8px 4px;
      background: #1769e0;
      color: white;
      font-size: 16px;
      cursor: pointer;
    }

    button:hover {
      background: #0d4eac;
    }

    #status {
      padding: 12px;
      background: #edf5ff;
      border-radius: 10px;
      line-height: 1.5;
    }

    footer {
      text-align: center;
      padding: 20px;
      color: #53627a;
    }
  </style>
</head>

<body>
  <header>
    <h1>Yuzni tanish tizimi</h1>
    <p>Sun'iy intellekt texnologiyalarini o'rganish loyihasi</p>
  </header>

  <main>
    <h2>Jonli kamera</h2>
    <p>Kamerani yoqing va tasvirni ko'ring.</p>

    <video id="camera" autoplay playsinline muted></video>

    <div>
      <button id="start">Kamerani yoqish</button>
      <button id="stop">Kamerani o'chirish</button>
    </div>

    <p id="status" role="status">
      Kamera hali yoqilmagan.
    </p>

    <p>
      Bu boshlang'ich versiya. Hozircha u yuzni aniqlamaydi
      yoki shaxsni tanimaydi.
    </p>
  </main>

  <footer>
 
  </footer>

  <script>
    const video = document.getElementById("camera");
    const status = document.getElementById("status");
    let stream = null;

    document.getElementById("start").onclick = async () => {
      try {
        stream = await navigator.mediaDevices.getUserMedia({
          video: true,
          audio: false
        });

        video.srcObject = stream;
        status.textContent = "Kamera muvaffaqiyatli yoqildi.";
      } catch (error) {
        status.textContent =
          "Kamera ochilmadi. Ruxсатларни ва браузерни текширинг.";
      }
    };

    document.getElementById("stop").onclick = () => {
      if (stream) {
        stream.getTracks().forEach(track => track.stop());
        video.srcObject = null;
        stream = null;
      }

      status.textContent = "Kamera o'chirildi.";
    };
  </script>
</body>
</html>
