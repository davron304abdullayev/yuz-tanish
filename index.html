<!DOCTYPE html>
<html lang="uz">
<head>
<meta charset="utf-8">
<meta name="viewport" content="width=device-width, initial-scale=1">
<title>Yuz tanish</title>
<script src="https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/dist/face-api.js"></script>
<style>
body{margin:0;min-height:100vh;color:#fff;font-family:sans-serif;text-align:center;
background:linear-gradient(135deg,#0f2027,#203a43,#2c5364);padding-bottom:30px}
h3{font-size:26px;margin:18px 0 6px;letter-spacing:1px}
#holat{margin:8px auto;padding:8px 14px;max-width:90%;background:rgba(255,255,255,.12);border-radius:12px;font-size:15px}
.box{position:relative;width:94%;max-width:480px;margin:14px auto;border-radius:18px;overflow:hidden;box-shadow:0 8px 30px rgba(0,0,0,.5);background:#000}
video,canvas{width:100%;display:block}
canvas{position:absolute;top:0;left:0}
button,input{font-size:16px;margin:6px;padding:12px 16px;border:none;border-radius:12px}
input{background:rgba(255,255,255,.95);color:#111;max-width:80%}
input[type=file]{background:transparent;color:#fff;max-width:90%}
button{background:linear-gradient(135deg,#00c6ff,#0072ff);color:#fff;font-weight:bold;box-shadow:0 4px 12px rgba(0,0,0,.3)}
button:active{transform:scale(.97)}
#tozala{background:linear-gradient(135deg,#ff5f6d,#c0392b)}
</style>
</head>
<body>
<h3>Yuz tanish</h3>
<div id="holat">Modellar yuklanmoqda...</div>
<div>
<input id="ism" placeholder="Ism (masalan, Davron)">
<input id="rasm" type="file" accept="image/*">
<button id="qosh">Qo'shish</button>
</div>
<button id="boshla">Kamerani yoqish</button>
<button id="almash">Kamerani almashtirish</button>
<button id="tozala">Hammasini o'chirish</button>
<div class="box"><video id="v" autoplay playsinline muted></video><canvas id="c"></canvas></div>
<script>
const MODEL = "https://cdn.jsdelivr.net/npm/@vladmandic/face-api@1.7.13/model/";
const holat = document.getElementById("holat");
const v = document.getElementById("v");
const c = document.getElementById("c");
let tanishlar = [], matcher = null;
let rejim = "user", loopBor = false;

try {
  const s = JSON.parse(localStorage.getItem("yuzlar") || "[]");
  tanishlar = s.map(x => ({ism: x.ism, d: new Float32Array(x.d)}));
} catch (e) {}

function saqla() {
  try {
    localStorage.setItem("yuzlar", JSON.stringify(
      tanishlar.map(t => ({ism: t.ism, d: Array.from(t.d)}))));
  } catch (e) {}
}

function yangila() {
  const m = {};
  tanishlar.forEach(t => (m[t.ism] = m[t.ism] || []).push(t.d));
  const list = Object.keys(m).map(n => new faceapi.LabeledFaceDescriptors(n, m[n]));
  matcher = list.length ? new faceapi.FaceMatcher(list, 0.5) : null;
}

Promise.all([
  faceapi.nets.tinyFaceDetector.loadFromUri(MODEL),
  faceapi.nets.faceLandmark68Net.loadFromUri(MODEL),
  faceapi.nets.faceRecognitionNet.loadFromUri(MODEL)
]).then(() => {
  yangila();
  holat.textContent = "Tayyor. Tanishlar soni: " + tanishlar.length;
}).catch(e => holat.textContent = "Model yuklanmadi: " + e);

document.getElementById("qosh").onclick = async () => {
  const ism = document.getElementById("ism").value.trim();
  const f = document.getElementById("rasm").files[0];
  if (!ism || !f) { holat.textContent = "Ism yozing va rasm tanlang"; return; }
  holat.textContent = "Rasm tekshirilmoqda...";
  const img = await faceapi.bufferToImage(f);
  const r = await faceapi
    .detectSingleFace(img, new faceapi.TinyFaceDetectorOptions({inputSize: 512}))
    .withFaceLandmarks().withFaceDescriptor();
  if (!r) { holat.textContent = "Rasmda yuz topilmadi. Boshqa rasm tanlang."; return; }
  tanishlar.push({ism, d: r.descriptor});
  saqla(); yangila();
  holat.textContent = ism + " qo'shildi. Jami: " + tanishlar.length;
};

document.getElementById("tozala").onclick = () => {
  if (!confirm("Hamma saqlangan yuzlar o'chiriladi. Rozimisiz?")) return;
  tanishlar = []; saqla(); yangila();
  holat.textContent = "Tozalandi. Tanishlar soni: 0";
};

async function kameraYoq() {
  if (v.srcObject) v.srcObject.getTracks().forEach(t => t.stop());
  v.onloadedmetadata = () => {
    c.width = v.videoWidth; c.height = v.videoHeight;
    v.play(); aniqla();
  };
  try {
    v.srcObject = await navigator.mediaDevices.getUserMedia(
      {video: {facingMode: {ideal: rejim}}});
  } catch (e) { holat.textContent = "Kameraga ruxsat berilmadi"; }
}

document.getElementById("boshla").onclick = kameraYoq;
document.getElementById("almash").onclick = () => {
  rejim = rejim === "user" ? "environment" : "user";
  kameraYoq();
};

function aniqla() {
  if (loopBor) return;
  loopBor = true;
  const ctx = c.getContext("2d");
  const opts = new faceapi.TinyFaceDetectorOptions({inputSize: 320});
  const loop = async () => {
    const res = await faceapi.detectAllFaces(v, opts)
      .withFaceLandmarks().withFaceDescriptors();
    if (c.width !== v.videoWidth) { c.width = v.videoWidth; c.height = v.videoHeight; }
    ctx.clearRect(0, 0, c.width, c.height);
    res.forEach(r => {
      let ism = "Notanish", rang = "red";
      if (matcher) {
        const m = matcher.findBestMatch(r.descriptor);
        if (m.label !== "unknown") { ism = m.label; rang = "lime"; }
      }
      const b = r.detection.box;
      ctx.strokeStyle = rang; ctx.lineWidth = 3;
      ctx.strokeRect(b.x, b.y, b.width, b.height);
      ctx.fillStyle = rang; ctx.font = "24px sans-serif";
      ctx.fillText(ism, b.x, b.y > 28 ? b.y - 8 : b.y + 24);
    });
    requestAnimationFrame(loop);
  };
  loop();
}
</script>
</body>
</html>
